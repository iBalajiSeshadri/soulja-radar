name: Auto-Sync Fantasy News & Rankings

on:
  schedule:
    # Runs every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  # Allows you to manually trigger it anytime from GitHub UI
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Sync & Engine Re-calc
        run: |
          python sync_fantasy_news.py || true
          python fantasy_engine.py

      - name: Commit & Push Updated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add camp_overrides.json news_updates.json top_150_draft_board.csv 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-sync fantasy news & board [skip ci]" && git push)